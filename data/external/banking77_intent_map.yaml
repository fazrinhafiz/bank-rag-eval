# Banking77 intent -> Bank Seri Andalas knowledge base coverage.
#
# Written by reading the 7 policy docs and 5+ example queries per intent, and committed BEFORE any
# Banking77 query was run through the pipeline, so the labels could not be tuned to the results
# (see git history). Labels are per intent, not per query, so some individual queries are mislabelled;
# treat results as approximate.
#
# covered:     typical queries in this intent are answered by the listed doc(s); retrieval counts a hit
#              if ANY listed doc is in the top-k.
# ambiguous:   the docs answer part of it; excluded from scoring (but still counted for false blocks).
# not_covered: the docs do not answer it; the correct behaviour is to abstain.
#
# Banking77 comes from a UK fintech (top-ups, GBP, virtual cards), so most intents are out of scope for
# a Malaysian retail bank's policies. That mismatch is real and is why this is an out-of-scope test.

covered:
  age_limit: {docs: [savings-account], why: "eSavings applicants must be at least 18"}
  card_payment_not_recognised: {docs: [complaints, fraud-and-scams], why: "unauthorised transaction disputes (60 days); fraud reporting"}
  cash_withdrawal_charge: {docs: [fees-and-charges, credit-card], why: "ATM withdrawal fees; credit card cash advance fee"}
  cash_withdrawal_not_recognised: {docs: [complaints, fraud-and-scams], why: "unauthorised transactions; fraud hotline and Kill Switch"}
  compromised_card: {docs: [fraud-and-scams, credit-card], why: "fraud hotline, Kill Switch; lost or stolen card liability"}
  exchange_charge: {docs: [fees-and-charges], why: "1% currency conversion charge on foreign currency transactions"}
  lost_or_stolen_card: {docs: [credit-card, fraud-and-scams], why: "lost or stolen card section; Kill Switch"}
  terminate_account: {docs: [savings-account], why: "closing an eSavings account, RM10 fee within 3 months"}
  transfer_fee_charged: {docs: [fees-and-charges], why: "fund transfer fees (free up to RM5,000, RM0.50 above, etc.)"}

ambiguous:
  atm_support: "fees list ATM charges and cash advance says 'any ATM displaying the card network logo', but not which ATMs accept the card"
  beneficiary_not_allowed: "new-device cooling-off blocks new recipients, but most queries are about other reasons"
  card_payment_fee_charged: "1% conversion charge covers foreign payments only"
  card_payment_wrong_exchange_rate: "conversion charge is documented, rates are not"
  declined_card_payment: "over-limit transactions are declined by default; other decline reasons are not covered"
  declined_transfer: "cooling-off period explains some declines only"
  direct_debit_payment_not_recognised: "dispute policy covers card transactions, not direct debits"
  edit_personal_details: "privacy notice allows correction requests, but not how to change an address"
  extra_charge_on_statement: "fee schedule may explain some charges"
  getting_spare_card: "credit card supplementary cards are covered; spare debit cards are not"
  lost_or_stolen_phone: "Kill Switch can block online banking, but phone loss is not addressed directly"
  transaction_charged_twice: "dispute route exists, double charging not addressed"
  verify_my_identity: "eSavings uses electronic KYC; required documents are not listed"
  why_verify_identity: "privacy notice lists purposes (fraud, money laundering, legal requirements)"
  wrong_exchange_rate_for_cash_withdrawal: "overseas ATM 1% conversion charge, rates not covered"

not_covered:
  - Refund_not_showing_up
  - activate_my_card
