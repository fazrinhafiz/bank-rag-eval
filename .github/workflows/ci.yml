name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests (incl. golden-set label checks and gate mutation tests)
        run: pytest -q

      - name: Quality gate - offline eval on the test split (fails the build if any gate fails)
        run: python -m bankrag eval

      - name: Independent evaluation on Banking77 + deepset prompt injections (reported, not gated)
        run: python -m bankrag eval-external > /dev/null

      - name: Drift monitor smoke test (control must be OK, surge must ALERT)
        run: python scripts/simulate_drift.py > /dev/null

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
